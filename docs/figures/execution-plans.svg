<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-label="Per-Request Static Execution Plans">
  <title>Per-Request Static Execution Plans</title>
  <desc>Four static action sequences compiled from the eight-node composite feature graph.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#FFFFFF" stroke="#475569" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1.5 L 9 5 L 0.5 8.5 z" fill="#1E3A5F"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1.5 L 9 5 L 0.5 8.5 z" fill="#B45309"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1.5 L 9 5 L 0.5 8.5 z" fill="#4338CA"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1.5 L 9 5 L 0.5 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0.5 1.5 L 9 5 L 0.5 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1038" height="418" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="28" y="35" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#0F172A">One Graph, Four Specialized Execution Plans</text>
  <text x="28" y="54" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748B">Each event type or query compiles to its minimal topologically ordered action sequence.</text>
  <rect x="640" y="18" width="372" height="38" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="654" y="29" width="16" height="16" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text x="676" y="41" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#92400E">.handle (mutates state)</text>
  <rect x="842" y="29" width="16" height="16" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="864" y="41" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#1E3A8A">.eval (updates value)</text>
  <rect x="26" y="76" width="988" height="72" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="40" y="104" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" fill="#0F172A">on(BookUpdate)</text>
  <text x="40" y="122" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">1 action · pure state write</text>
  <line x1="204" y1="86" x2="204" y2="138" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="218" y="86" width="113" height="30" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.35"/>
  <text x="274.5" y="104.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="600" fill="#92400E">0: Book.handle</text>
  <text x="218" y="134" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#475569">7 downstream nodes skipped; evaluators run lazily when needed</text>
  <rect x="26" y="158" width="988" height="72" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="40" y="186" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" fill="#0F172A">on(Trade)</text>
  <text x="40" y="204" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">3 actions · eval + handle</text>
  <line x1="204" y1="168" x2="204" y2="220" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="218" y="168" width="112" height="30" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.35"/>
  <text x="274.0" y="186.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="600" fill="#1E3A8A">0: Mid.eval</text>
  <line x1="332" y1="183.0" x2="350" y2="183.0" stroke="#64748B" stroke-width="1.35" marker-end="url(#arrow-muted)"/>
  <rect x="352" y="168" width="113" height="30" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.35"/>
  <text x="408.5" y="186.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="600" fill="#1E3A8A">1: Spread.eval</text>
  <line x1="467" y1="183.0" x2="485" y2="183.0" stroke="#64748B" stroke-width="1.35" marker-end="url(#arrow-muted)"/>
  <rect x="487" y="168" width="171" height="30" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.35"/>
  <text x="572.5" y="186.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="600" fill="#92400E">2: TradePressure.handle</text>
  <text x="218" y="216" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#475569">Computes only Mid &amp; Spread for TradePressure; skips Imbalance, FairValue, BookBias, Score</text>
  <rect x="26" y="240" width="988" height="72" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="40" y="268" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" fill="#0F172A">on(Reset)</text>
  <text x="40" y="286" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">1 action · input-free handler</text>
  <line x1="204" y1="250" x2="204" y2="302" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="218" y="250" width="171" height="30" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.35"/>
  <text x="303.5" y="268.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="600" fill="#92400E">0: TradePressure.handle</text>
  <text x="218" y="298" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#475569">on&lt;Reset&gt; declares inputs&lt;&gt;, so even Mid and Spread are skipped</text>
  <rect x="26" y="322" width="988" height="72" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="40" y="350" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" fill="#0F172A">evaluate&lt;Outputs&gt;()</text>
  <text x="40" y="368" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">7 actions · shared closure</text>
  <line x1="204" y1="332" x2="204" y2="384" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="218" y="333" width="73" height="28" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.35"/>
  <text x="254.5" y="351.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2" font-weight="600" fill="#1E3A8A">0: Mid.eval</text>
  <line x1="293" y1="347.0" x2="301" y2="347.0" stroke="#64748B" stroke-width="1.35" marker-end="url(#arrow-muted)"/>
  <rect x="303" y="333" width="90" height="28" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.35"/>
  <text x="348.0" y="351.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2" font-weight="600" fill="#1E3A8A">1: Spread.eval</text>
  <line x1="395" y1="347.0" x2="403" y2="347.0" stroke="#64748B" stroke-width="1.35" marker-end="url(#arrow-muted)"/>
  <rect x="405" y="333" width="106" height="28" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.35"/>
  <text x="458.0" y="351.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2" font-weight="600" fill="#1E3A8A">2: Imbalance.eval</text>
  <line x1="513" y1="347.0" x2="521" y2="347.0" stroke="#64748B" stroke-width="1.35" marker-end="url(#arrow-muted)"/>
  <rect x="523" y="333" width="106" height="28" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.35"/>
  <text x="576.0" y="351.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2" font-weight="600" fill="#1E3A8A">3: FairValue.eval</text>
  <line x1="631" y1="347.0" x2="639" y2="347.0" stroke="#64748B" stroke-width="1.35" marker-end="url(#arrow-muted)"/>
  <rect x="641" y="333" width="101" height="28" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.35"/>
  <text x="691.5" y="351.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2" font-weight="600" fill="#1E3A8A">4: BookBias.eval</text>
  <line x1="744" y1="347.0" x2="752" y2="347.0" stroke="#64748B" stroke-width="1.35" marker-end="url(#arrow-muted)"/>
  <rect x="754" y="333" width="128" height="28" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.35"/>
  <text x="818.0" y="351.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2" font-weight="600" fill="#1E3A8A">5: TradePressure.eval</text>
  <line x1="884" y1="347.0" x2="892" y2="347.0" stroke="#64748B" stroke-width="1.35" marker-end="url(#arrow-muted)"/>
  <rect x="894" y="333" width="84" height="28" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.35"/>
  <text x="936.0" y="351.5" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.2" font-weight="600" fill="#1E3A8A">6: Score.eval</text>
  <text x="218" y="380" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#475569">Zero handlers run (history preserved); shared Mid, Spread &amp; FairValue each run once -&gt; (score, fair)</text>
</svg>
