<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 434" width="980" height="434" role="img" aria-label="FlexModelPlanner Architecture">
  <title>FlexModelPlanner Architecture</title>
  <desc>Separation between compile-time type-level metadata/planning and runtime engine instance state.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#FFFFFF" stroke="#475569" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1.5 L 9 5 L 0.5 8.5 z" fill="#1E3A5F"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1.5 L 9 5 L 0.5 8.5 z" fill="#B45309"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1.5 L 9 5 L 0.5 8.5 z" fill="#4338CA"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1.5 L 9 5 L 0.5 8.5 z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0.5 1.5 L 9 5 L 0.5 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="978" height="432" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="28" y="35" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#0F172A">Compile-Time Planning vs. Runtime Execution</text>
  <text x="28" y="54" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="11.5" fill="#64748B">Topology and plans are pure C++20 types and constexpr arrays; each engine&lt;Graph, Roots&gt; instance owns isolated state and value slots.</text>
  <rect x="26" y="74" width="374" height="334" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="6,4"/>
  <rect x="42" y="86" width="194" height="22" rx="5" fill="#EEF2FF"/>
  <text x="52" y="101" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#3730A3">COMPILE TIME (consteval)</text>
  <rect x="494" y="74" width="460" height="334" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
  <rect x="510" y="86" width="308" height="22" rx="5" fill="#ECFEFF"/>
  <text x="520" y="101" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#0F766E">RUNTIME INSTANCE (engine&lt;Graph, Roots&gt;)</text>
  <rect x="42" y="120" width="342" height="70" rx="7" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.4"/>
  <text x="56" y="142" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#312E81">1. Declarative Graph Schema</text>
  <text x="56" y="161" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#334155">graph&lt;node&lt;Id, Kernel, on&lt;...&gt;, eval&lt;...&gt;&gt;&gt;</text>
  <text x="56" y="178" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">Type-level IDs, ports (state_of / value_of), and roots&lt;...&gt;</text>
  <rect x="42" y="216" width="342" height="70" rx="7" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.4"/>
  <text x="56" y="238" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#312E81">2. Static Validator &amp; Action Planner</text>
  <text x="56" y="257" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#334155">validate_metadata() · validate_callbacks() · DFS</text>
  <text x="56" y="274" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">Checks signatures, noexcept, and cycles; finds live closure</text>
  <rect x="42" y="312" width="342" height="76" rx="7" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.4"/>
  <text x="56" y="334" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#312E81">3. Immutable Execution Plans</text>
  <text x="56" y="353" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#334155">constexpr plan&lt;N&gt; { actions[2N], size }</text>
  <text x="56" y="370" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">Ordered {node_index, handle | eval}; no instance pointers</text>
  <line x1="213" y1="190" x2="213" y2="214" stroke="#4338CA" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
  <line x1="213" y1="286" x2="213" y2="310" stroke="#4338CA" stroke-width="1.6" marker-end="url(#arrow-indigo)"/>
  <rect x="512" y="120" width="424" height="68" rx="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
  <text x="526" y="142" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#134E4A">Unrolled Static Dispatcher</text>
  <text x="526" y="161" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#334155">on(const Event&amp;) · evaluate&lt;Query&gt;() · replay(engine, range)</text>
  <text x="526" y="178" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">Fold expression expands plan.actions[I] into direct static calls</text>
  <rect x="512" y="216" width="424" height="68" rx="7" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="526" y="238" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">Isolated Kernel Callbacks (noexcept)</text>
  <text x="526" y="257" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#334155">Kernel::handle(state&amp;, event, in...)  |  Kernel::eval(state, in...)</text>
  <text x="526" y="274" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">Receives only own state and declared read-only input references</text>
  <rect x="512" y="314" width="204" height="74" rx="7" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="526" y="336" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#1E3A8A">Owned states_ Tuple</text>
  <text x="526" y="355" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#334155">std::tuple&lt;State...&gt;</text>
  <text x="526" y="372" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">Mutated only by own handle()</text>
  <rect x="732" y="314" width="204" height="74" rx="7" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.4"/>
  <text x="746" y="336" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#134E4A">Owned values_ Slots</text>
  <text x="746" y="355" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10" fill="#334155">std::tuple&lt;Value...&gt;</text>
  <text x="746" y="372" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10.2" fill="#64748B">Updated by eval(); lent on query</text>
  <path d="M 384 350 C 452 350, 442 156, 510 156" fill="none" stroke="#4338CA" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-indigo)"/>
  <rect x="405" y="234" width="84" height="34" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.1"/>
  <text x="447" y="248" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" font-weight="600" fill="#3730A3">plan.actions</text>
  <text x="447" y="261" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="9.2" fill="#4338CA">inlined at CT</text>
  <line x1="724" y1="188" x2="724" y2="214" stroke="#0F766E" stroke-width="1.7" marker-end="url(#arrow-teal)"/>
  <text x="734" y="205" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="10" fill="#0F766E">direct static call sequence</text>
  <line x1="614" y1="284" x2="614" y2="312" stroke="#1E3A5F" stroke-width="1.6" marker-end="url(#arrow-navy)"/>
  <text x="604" y="302" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#1E3A8A">handle / state_of</text>
  <line x1="834" y1="284" x2="834" y2="312" stroke="#0F766E" stroke-width="1.6" marker-end="url(#arrow-teal)"/>
  <text x="843" y="302" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" fill="#0F766E">eval / value_of</text>
</svg>
